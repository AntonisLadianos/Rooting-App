<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Rooting</title>
  <meta name="description" content="Βέλτιστη σειρά για τις διευθύνσεις των δρομολογίων σου">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rooting">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <!-- Κουμπιά πάνω στον χάρτη (πάνω δεξιά) -->
    <div class="map-ctrls">
      <button id="btnSettings" class="map-fab" title="Ρυθμίσεις" aria-label="Ρυθμίσεις">⚙︎</button>
      <button id="btnLocate" class="map-fab" title="Η θέση μου" aria-label="Η θέση μου">◎</button>
      <button id="btnTraffic" class="map-fab hidden" title="Κίνηση" aria-label="Κίνηση στους δρόμους">🚦</button>
      <button id="btnSat" class="map-fab hidden" title="Δορυφόρος" aria-label="Δορυφορικός χάρτης">🛰</button>
      <button id="btnNorth" class="map-fab hidden" title="Βορράς" aria-label="Επαναφορά προσανατολισμού">🧭</button>
    </div>

    <!-- Κάρτα που σέρνεται (κάτω / μέση / πάνω) -->
    <section id="sheet" class="sheet">
      <div class="sheet-handle" id="sheetHandle"><div class="grabber"></div></div>
      <div class="sheet-body" id="sheetBody">

        <!-- Επόμενη στάση (μετά τη βελτιστοποίηση) -->
        <div id="nextCard" class="card next-card hidden">
          <div class="next-top">
            <span class="next-label">Επόμενη <span id="nextIdx"></span></span>
            <span id="nextRemain" class="next-remain"></span>
          </div>
          <div class="progress"><div id="nextProgress"></div></div>
          <div id="nextTitle" class="next-title"></div>
          <div id="nextSub" class="next-sub"></div>
          <div class="next-actions" id="nextActions">
            <a id="btnNavNext" class="btn btn-primary btn-lg">➤ Πλοήγηση</a>
            <button id="btnDoneNext" class="btn btn-success btn-lg">✓ Παραδόθηκε</button>
            <a id="btnCallNext" class="btn btn-ghost btn-lg call-btn hidden" aria-label="Κλήση">📞</a>
          </div>
          <div id="batchBar" class="batch-bar hidden">
            <div id="batchText" class="batch-text"></div>
            <div class="batch-btns">
              <button id="btnBatchDone" class="btn btn-success"></button>
              <button id="btnBatchCancel" class="btn btn-ghost" aria-label="Ακύρωση">✕</button>
            </div>
          </div>
          <div class="chips">
            <a id="btnFullRoute" class="chip">🗺 Google Maps</a>
            <button id="btnDrive" class="chip">🚗 Οδήγηση</button>
            <button id="btnSkipNext" class="chip">⏭ Αργότερα</button>
            <button id="btnReopt" class="chip">⚡ Νέα σειρά</button>
          </div>
        </div>

        <div id="summary" class="summary hidden"></div>

        <!-- Προσθήκη διευθύνσεων -->
        <div id="addBlock">
          <div class="search-wrap">
            <input id="search" type="search" placeholder="🔍 Πρόσθεσε διεύθυνση…" autocomplete="off" enterkeyhint="search">
            <ul id="suggestions" class="suggestions hidden"></ul>
          </div>
          <div class="row-btns add-row">
            <button id="btnShot" class="btn btn-primary">📷 Screenshot</button>
            <button id="btnPaste" class="btn btn-ghost">📋 Λίστα</button>
          </div>
          <input id="shotInput" type="file" accept="image/*" multiple hidden>
        </div>

        <!-- Αφετηρία / Τέλος -->
        <div class="card endpoints">
          <button id="startRow" class="endpoint">
            <span class="dot dot-start"></span>
            <span class="ep-text"><small>Αφετηρία</small><span id="startLabel">📍 Τρέχουσα τοποθεσία</span></span>
            <span class="chev">›</span>
          </button>
          <button id="endRow" class="endpoint">
            <span class="dot dot-end"></span>
            <span class="ep-text"><small>Τέλος</small><span id="endLabel">Όπου τελειώσει η τελευταία στάση</span></span>
            <span class="chev">›</span>
          </button>
        </div>

        <div class="list-head">
          <h2>Στάσεις <span id="stopCount" class="badge">0</span></h2>
          <span id="doneCount" class="muted"></span>
          <button id="btnClear" class="btn btn-link list-clear">🗑 Καθαρισμός</button>
        </div>
        <ol id="stops" class="stops"></ol>
        <details id="doneBox" class="done-box hidden">
          <summary id="doneSummary">Παραδόθηκαν</summary>
          <ol id="doneStops" class="stops"></ol>
        </details>
        <p id="swipeHint" class="muted small swipe-hint hidden">Σύρε μια στάση δεξιά για «Παραδόθηκε», αριστερά για διαγραφή.</p>
        <p id="emptyHint" class="empty">Πρόσθεσε τις διευθύνσεις σου από πάνω (γράφοντας, με screenshot ή με λίστα), ή πάτα παρατεταμένα πάνω στον χάρτη.</p>

        <div class="bottom-spacer"></div>
      </div>
    </section>

    <div id="optimizeBar">
      <button id="btnOptimize" class="btn btn-primary btn-block btn-lg">⚡ Βελτιστοποίηση διαδρομής</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" data-close aria-label="Κλείσιμο">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Λειτουργία οδήγησης -->
  <div id="drive" class="drive hidden">
    <div class="d-head">
      <span id="dProgress"></span>
      <button id="dClose" class="btn btn-ghost d-close">✕ Έξοδος</button>
    </div>
    <div id="dBody" class="d-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="busy" class="busy hidden"><div class="spinner"></div><div id="busyText">Υπολογισμός…</div></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="solver.js"></script>
  <script src="geo.js"></script>
  <script src="ocr.js"></script>
  <script src="mapview.js"></script>
  <script src="app.js"></script>
</body>
</html>
